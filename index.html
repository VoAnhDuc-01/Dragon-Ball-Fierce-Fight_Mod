<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dragon Ball Z</title>
  <link rel="icon" type="image/png" href="fav.favicon.png">
  <link rel="shortcut icon" type="image/png" href="fav.favicon.png">
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    ruffle-player {
      width: 100%;
      height: 100%;
    }
    /* Giao diện kéo thả tệp phòng khi mở qua file:/// */
    #drop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      z-index: 100;
    }
    #drop-overlay.active {
      display: flex;
    }
    .file-btn {
      background: #f59e0b;
      color: #000;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 14px;
      border: none;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div id="ime-hint" style="position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); color: #38bdf8; font-family: system-ui, sans-serif; font-size: 13px; padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.4); z-index: 999; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: none; transition: opacity 0.8s;">
    💡 <b>Mẹo:</b> Chuyển bộ gõ sang <b>[E]</b> (tiếng Anh) hoặc dùng <b>phím mũi tên ← →</b> để di chuyển mượt mà không bị kẹt phím A / D do UniKey
  </div>
  <div id="game-container">
    <div id="drop-overlay">
      <h2>Không thể tự động tải db.swf</h2>
      <p style="margin-top: 8px; color: #94a3b8;">(Trình duyệt chặn đọc trực tiếp qua file:///)</p>
      <label class="file-btn" for="file-input">📁 Chọn tệp db.swf</label>
      <p style="margin-top: 12px; font-size: 0.9rem; color: #64748b;">hoặc kéo thả db.swf vào đây</p>
    </div>
  </div>

  <input type="file" id="file-input" accept=".swf" style="display: none;">

  <script>
    // Cấu hình Ruffle: Tự động chạy và ẨN HOÀN TOÀN icon "Bấm để bật tiếng"
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden", // Không bao giờ hiện popup bắt bấm để bật tiếng
      splashScreen: false,
      preloader: false,
      letterbox: "on",
      forceScale: true,
      quality: "high"
    };

    let player = null;
    const container = document.getElementById("game-container");
    const dropOverlay = document.getElementById("drop-overlay");
    const fileInput = document.getElementById("file-input");

    // Tự động kích hoạt AudioContext khi người dùng chạm phím hoặc click đầu tiên
    function ensureAudioResumed() {
      const audioCtx = window.AudioContext || window.webkitAudioContext;
      if (audioCtx) {
        try {
          const dummyCtx = new audioCtx();
          if (dummyCtx.state === "suspended") {
            dummyCtx.resume();
          }
        } catch (e) {}
      }
    }
    window.addEventListener("keydown", ensureAudioResumed, { once: true });
    window.addEventListener("pointerdown", ensureAudioResumed, { once: true });
    window.addEventListener("click", ensureAudioResumed, { once: true });

    // Tự động làm mờ thông báo mẹo sau 7 giây
    setTimeout(() => {
      const hint = document.getElementById("ime-hint");
      if (hint) {
        hint.style.opacity = "0";
        setTimeout(() => hint.remove(), 800);
      }
    }, 7000);

    // BẢO VỆ CHỐNG KẸT PHÍM A / D KHI BẬT BỘ GÕ TIẾNG VIỆT (UNIKEY / EVKEY)
    const GAME_KEYS = {
      'KeyA': { keyCode: 65, key: 'a' },
      'KeyD': { keyCode: 68, key: 'd' },
      'KeyW': { keyCode: 87, key: 'w' },
      'KeyS': { keyCode: 83, key: 's' },
      'KeyJ': { keyCode: 74, key: 'j' },
      'KeyK': { keyCode: 75, key: 'k' },
      'KeyL': { keyCode: 76, key: 'l' },
      'KeyU': { keyCode: 85, key: 'u' },
      'KeyI': { keyCode: 73, key: 'i' },
      'KeyO': { keyCode: 79, key: 'o' },
      'ArrowLeft': { keyCode: 37, key: 'ArrowLeft' },
      'ArrowUp': { keyCode: 38, key: 'ArrowUp' },
      'ArrowRight': { keyCode: 39, key: 'ArrowRight' },
      'ArrowDown': { keyCode: 40, key: 'ArrowDown' }
    };

    const activeKeys = new Set();

    window.addEventListener("keydown", (e) => {
      if (GAME_KEYS[e.code]) {
        activeKeys.add(e.code);
      }
    }, true);

    // Khi phím được nhả: Nếu bộ gõ tiếng Việt can thiệp gửi keyCode 229 / "Process", Ruffle sẽ bỏ lỡ keyup
    // Ta tự động tạo keyup sạch chuẩn để Ruffle nhả phím tức thì
    window.addEventListener("keyup", (e) => {
      const mapping = GAME_KEYS[e.code];
      if (mapping) {
        activeKeys.delete(e.code);
        if (e.isComposing || e.key === "Process" || e.keyCode === 229 || e.which === 229) {
          const cleanUpEvent = new KeyboardEvent("keyup", {
            key: mapping.key,
            code: e.code,
            keyCode: mapping.keyCode,
            which: mapping.keyCode,
            bubbles: true,
            cancelable: true
          });
          const target = player || document.activeElement || window;
          target.dispatchEvent(cleanUpEvent);
        }
      }
    }, true);

    // Khi người dùng click ra ngoài hoặc chuyển tab, tự động nhả toàn bộ phím
    window.addEventListener("blur", () => {
      activeKeys.forEach((code) => {
        const mapping = GAME_KEYS[code];
        if (mapping && player) {
          const cleanUpEvent = new KeyboardEvent("keyup", {
            key: mapping.key,
            code: code,
            keyCode: mapping.keyCode,
            which: mapping.keyCode,
            bubbles: true,
            cancelable: true
          });
          player.dispatchEvent(cleanUpEvent);
        }
      });
      activeKeys.clear();
    });

    function loadSwf(dataOrUrl) {
      if (!player) {
        const ruffle = window.RufflePlayer.newest();
        player = ruffle.createPlayer();
        player.id = "ruffle-player";
        container.appendChild(player);
      }
      
      const config = typeof dataOrUrl === "string" 
        ? { url: dataOrUrl } 
        : { data: dataOrUrl };
      
      config.autoplay = "on";
      config.unmuteOverlay = "hidden";
      config.letterbox = "on";
      config.quality = "high";

      player.load(config).then(() => {
        dropOverlay.classList.remove("active");
        ensureAudioResumed();
      }).catch(err => {
        console.warn("Lỗi load SWF:", err);
        dropOverlay.classList.add("active");
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      // Tải trực tiếp db.swf
      loadSwf("db.swf");

      // Xử lý nạp file thủ công dự phòng
      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => loadSwf(evt.target.result);
        reader.readAsArrayBuffer(file);
      });

      // Kéo thả file
      container.addEventListener("dragover", (e) => e.preventDefault());
      container.addEventListener("drop", (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => loadSwf(evt.target.result);
          reader.readAsArrayBuffer(file);
        }
      });
    });
  </script>
</body>
</html>
